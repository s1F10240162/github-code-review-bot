name: AI Code Reviewer (OpenAI)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:
    secrets:
      OPENAI_API_KEY:
        required: true

jobs:
  review:
    name: Run OpenAI Code Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4

      - name: Checkout BOT Repository
        uses: actions/checkout@v4
        with:
          repository: 's1F10240162/github-code-review-bot'
          ref: 'test/api-contract-detection'  # TODO: 検証用の一時的な上書き。検証後に削除しmainのデフォルトに戻すこと
          path: '.github-code-review-bot'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github-code-review-bot/requirements.txt

      - name: Run AI Code Review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OPENAI_MODEL: 'gpt-4o-mini'
        run: |
          python .github-code-review-bot/src/review_pr.py

